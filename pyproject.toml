[build-system]
build-backend = 'mesonpy'
requires = ['meson-python>=0.15']

[project]
name = 'vapoursynth-awarpsharp2'
dynamic = ['version']
description = 'AWarpSharp2 edge-warping sharpener (AWarpSharp2, ASobel, ABlur, AWarp) for VapourSynth (API 4)'
readme = 'readme.rst'
requires-python = '>=3.8'
dependencies = ['VapourSynth']

[tool.meson-python.args]
setup = ['-Dpython_package=true']

[tool.meson-python.wheel]
exclude = ['*/*.dll.a', '*/*.lib', '*/*.a']
